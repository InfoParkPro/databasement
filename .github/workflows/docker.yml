name: Build and Push Docker Images,

on:
  push:
    branches:
      - main
      - 'docker/**'
    tags:
      - 'v*'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-base-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      base_image_tag: ${{ steps.base_image_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for base image changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            base:
              - 'docker/php/**'

      - name: Compute image namespace
        id: image_namespace
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Generate Docker tags
        id: tags
        uses: ./.github/actions/docker-tags
        with:
          image: ghcr.io/${{ steps.image_namespace.outputs.value }}/databasement-php

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check base image latest availability
        id: base_latest
        run: |
          IMAGE="ghcr.io/${{ steps.image_namespace.outputs.value }}/databasement-php:latest"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base image
        if: steps.filter.outputs.base == 'true' || steps.base_latest.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Determine base image tag for app build
        id: base_image_tag
        run: |
          if [[ "${{ steps.filter.outputs.base }}" == "true" || "${{ steps.base_latest.outputs.exists }}" != "true" ]]; then
            # Base image was rebuilt in this run, use the first generated tag.
            FIRST_TAG=$(echo '${{ steps.tags.outputs.tags }}' | head -1)
            echo "tag=${FIRST_TAG##*:}" >> $GITHUB_OUTPUT
          else
            # Base image already exists, re-use latest.
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

  build-app-image:
    runs-on: ubuntu-latest
    needs: build-base-image
    if: always() && !failure() && !cancelled()
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image namespace
        id: image_namespace
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: tags
        uses: ./.github/actions/docker-tags
        with:
          image: ghcr.io/${{ steps.image_namespace.outputs.value }}/databasement

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_COMMIT_HASH=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
            BASE_IMAGE=ghcr.io/${{ steps.image_namespace.outputs.value }}/databasement-php:${{ needs.build-base-image.outputs.base_image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
